name: Site checks

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install build tools
        run: npm ci
      - name: No known vulnerabilities in dependencies
        run: npm audit --audit-level=moderate
      - name: Film bundle matches its source
        run: npm run build:film && git diff --exit-code assets/film.js
      - name: Apply site.config.json, as the Netlify build does
        run: node scripts/configure.mjs
      - name: Links, anchors, structured data and page essentials
        run: node scripts/check-site.mjs
      - name: HTML validation
        run: npx html-validate "*.html"
      - name: Instant catalogue check tests
        run: node tests/check-core.test.mjs
      - name: Cloudflare Pages functions (edge cache and D1 stand-ins)
        run: node --experimental-sqlite --no-warnings tests/pages-functions.test.mjs
      - name: Cloudflare Pages build (public files only, links resolve)
        run: node scripts/build-pages.mjs
      - name: Page weight within budget
        run: npm run test:budget
      - name: Install Chromium for the browser checks
        run: npx playwright install --with-deps chromium
      - name: Browser checks (accessibility, demo button, story, folds, overflow, scroll speed)
        run: npm run test:browser
