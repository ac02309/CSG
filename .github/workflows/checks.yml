name: Site checks

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Install build tools
        run: npm ci
      - name: No known vulnerabilities in dependencies
        run: npm audit --audit-level=moderate
      - name: Film bundle matches its source
        run: npm run build:film && git diff --exit-code assets/film.js
      - name: Apply site.config.json, as the Netlify build does
        run: node scripts/configure.mjs
      - name: Links, anchors, structured data and page essentials
        run: node scripts/check-site.mjs
      - name: HTML validation
        run: npx html-validate "*.html"
