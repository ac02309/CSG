<script>
// Motion-designed brand film: one canvas, drawn as a pure function of time t (seconds), so every frame is reproducible.
// Timings match beats.json and the score (112 BPM); ?v renders the 9:16 cut.
const V = location.search.includes('v');
const W = V ? 1080 : 1920, H = V ? 1920 : 1080;
const cv = document.getElementById('c'), x = cv.getContext('2d');
{ const arc0 = CanvasRenderingContext2D.prototype.arc; CanvasRenderingContext2D.prototype.arc = function (cx, cy, r, ...rest) { return arc0.call(this, cx, cy, Math.max(0, r), ...rest); }; }  // springy eases can dip a hair below zero
cv.width = W; cv.height = H; cv.style.width = W + 'px'; cv.style.height = H + 'px';
const U = Math.min(W, H) / 1080;                       // 1 unit = 1px of a 1080-tall frame

// ---------- palette ----------
const INK = '#0a1020', INK2 = '#121a2e', PAPER = '#f3f5f9', FG = '#0b1220', MUTED = '#5b6578';
const TEAL = '#3fd0b8', BLUE = '#6f86ff', RED = '#ff4d5e', AMBER = '#ffb547', GREEN = '#2fcf8a';

// ---------- maths ----------
const cl = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const pr = (t, a, b) => cl((t - a) / (b - a));
const eo = k => 1 - Math.pow(1 - k, 3);
const eo5 = k => 1 - Math.pow(1 - k, 5);
const eio = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const eback = (k, s = 1.7) => 1 + (s + 1) * Math.pow(k - 1, 3) + s * Math.pow(k - 1, 2);
const spring = (k, f = 4.5, d = 6) => k <= 0 ? 0 : 1 - Math.exp(-d * k) * Math.cos(f * Math.PI * k);
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let r = Math.imul(seed ^ seed >>> 15, 1 | seed); r = r + Math.imul(r ^ r >>> 7, 61 | r) ^ r; return ((r ^ r >>> 14) >>> 0) / 4294967296; }; }
const mix = (a, b, k) => { const p = s => [1, 3, 5].map(i => parseInt(s.slice(i, i + 2), 16)); const A = p(a), B = p(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], k))).join(',')})`; };
const bez = (p0, p1, p2, p3, k) => { const u = 1 - k; return [u*u*u*p0[0] + 3*u*u*k*p1[0] + 3*u*k*k*p2[0] + k*k*k*p3[0], u*u*u*p0[1] + 3*u*u*k*p1[1] + 3*u*k*k*p2[1] + k*k*k*p3[1]]; };

// ---------- drawing helpers ----------
const font = (s, w = 700) => `${w} ${s}px Inter`;
function rr(px, py, w, h, r) { x.beginPath(); x.roundRect(px, py, w, h, r); }
function txt(s, px, py, size, color, w = 700, align = 'left', ls = 0) {
  x.font = font(size, w); x.fillStyle = color; x.textAlign = align; x.textBaseline = 'alphabetic';
  x.letterSpacing = ls + 'px'; x.fillText(s, px, py); x.letterSpacing = '0px';
}
// Headline with words that rise out of a mask, staggered. parts: [[word, colour?], ...]
function lay(parts, size, maxW, w = 760) {
  x.font = font(size, w); x.letterSpacing = (-0.045 * size) + 'px';
  const sp = x.measureText(' ').width, lines = [[]]; let lw = 0;
  for (const p of parts) { const ww = x.measureText(p[0]).width; if (lw + ww > maxW && lines.at(-1).length) { lines.push([]); lw = 0; } lines.at(-1).push({ s: p[0], c: p[1], w: ww, x: lw }); lw += ww + sp; }
  x.letterSpacing = '0px'; return lines;
}
function head(parts, px, py, size, t0, t, o = {}) {
  const { color = FG, maxW = W * .8, align = 'left', lh = 1.02, stagger = .07, dur = .55, out = 1e9, w = 760 } = o;
  const lines = lay(parts, size, maxW, w); let i = 0;
  const ko = pr(t, out, out + .35);
  lines.forEach((ln, li) => {
    const lw = ln.length ? ln.at(-1).x + ln.at(-1).w : 0, ox = align === 'center' ? px - lw / 2 : px;
    const y = py + li * size * lh;
    x.save(); x.beginPath(); x.rect(0, y - size * 1.05, W, size * 1.42); x.clip();
    for (const wd of ln) {
      const k = eo5(pr(t, t0 + i * stagger, t0 + i * stagger + dur)); i++;
      const dy = (1 - k) * size * 1.1 - ko * size * 1.1;
      x.font = font(size, w); x.letterSpacing = (-0.045 * size) + 'px'; x.textAlign = 'left';
      x.fillStyle = wd.c || color; x.fillText(wd.s, ox + wd.x, y + dy);
    }
    x.letterSpacing = '0px'; x.restore();
  });
  return lines.length * size * lh;
}
function eyebrow(s, px, py, t0, t, color = TEAL) {
  const k = eo(pr(t, t0, t0 + .4));
  x.globalAlpha = k; txt(s.toUpperCase(), px + (1 - k) * -20 * U, py, 22 * U, color, 650, 'left', 3 * U); x.globalAlpha = 1;
}
function logoMark(cx, cy, r, k = 1, lw = null, col1 = TEAL, col2 = BLUE) {
  // the CSG mark: a 270.8° ring starting at 25°, and a dot in the gap
  const g = x.createLinearGradient(cx - r, cy - r, cx + r, cy + r); g.addColorStop(0, col1); g.addColorStop(1, col2);
  x.strokeStyle = g; x.fillStyle = g; x.lineWidth = lw || r * .378; x.lineCap = 'round';
  const a0 = 25 * Math.PI / 180, sweep = 270.8 * Math.PI / 180 * eo(cl(k * 1.15));
  x.beginPath(); x.arc(cx, cy, r, a0, a0 + sweep); x.stroke();
  const dk = eback(pr(k, .7, 1)); if (dk > 0) { x.beginPath(); x.arc(cx + r * .933, cy - r * .344, r * .311 * dk, 0, Math.PI * 2); x.fill(); }
}
function bg(c) { x.fillStyle = c; x.fillRect(0, 0, W, H); }
function vignette(a = .5) { const g = x.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .3, W / 2, H / 2, Math.max(W, H) * .75); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(0,0,0,${a})`); x.fillStyle = g; x.fillRect(0, 0, W, H); }
function glow(cx, cy, r, c, a) { const g = x.createRadialGradient(cx, cy, 0, cx, cy, r); g.addColorStop(0, c); g.addColorStop(1, 'rgba(0,0,0,0)'); x.globalAlpha = a; x.fillStyle = g; x.fillRect(cx - r, cy - r, r * 2, r * 2); x.globalAlpha = 1; }
function chrome(t, dark) {
  // the corner signature, present throughout like a broadcast bug
  const c = dark ? 'rgba(255,255,255,.75)' : FG;
  logoMark(56 * U + 13 * U, 54 * U, 10 * U, 1, 3.6 * U);
  txt('Clarke Systems Group', 92 * U, 62 * U, 21 * U, c, 650);
  txt('clarkesystemsgroup.com', W - 56 * U, 62 * U, 19 * U, dark ? 'rgba(255,255,255,.45)' : MUTED, 500, 'right');
}

// ---------- six solutions, each its own working system ----------
const SOL = [
  { e: 'Integrations', l: [['Systems'], ['that'], ['talk'], ['to'], ['each'], ['other.', BLUE]] },
  { e: 'Quality checks', l: [['Every'], ['record'], ['checked.', GREEN]] },
  { e: 'Reporting', l: [['Reports'], ['that'], ['run'], ['themselves.', BLUE]] },
  { e: 'Scheduling', l: [['Plans'], ['that'], ['re-plan'], ['themselves.', BLUE]] },
  { e: 'AI processing', l: [['AI,'], ['proven'], ['before'], ['it'], ['ships.', BLUE]] },
  { e: 'Internal tools', l: [['Approvals'], ['in'], ['one'], ['place.', BLUE]] },
];
function vizBox() { return V ? { x: 70 * U, y: H * .43, w: W - 140 * U, h: H * .47 } : { x: W * .47, y: H * .17, w: W * .47, h: H * .72 }; }
function card(px, py, w, h, r = 18) { rr(px, py, w, h, r * U); x.fillStyle = '#fff'; x.fill(); x.strokeStyle = 'rgba(11,18,32,.08)'; x.lineWidth = 1.5 * U; x.stroke(); }

function vizIntegrations(b, k, t) {
  const n = [['Shopify', b.x + b.w * .16, b.y + b.h * .28], ['Xero', b.x + b.w * .84, b.y + b.h * .28], ['Warehouse', b.x + b.w * .16, b.y + b.h * .78], ['CRM', b.x + b.w * .84, b.y + b.h * .78]];
  const hub = [b.x + b.w / 2, b.y + b.h * .53];
  for (const [nm, nx, ny] of n) { // pipes
    x.strokeStyle = 'rgba(111,134,255,.25)'; x.lineWidth = 3 * U; x.beginPath(); x.moveTo(nx, ny); x.bezierCurveTo(nx + (hub[0] - nx) * .6, ny, hub[0], hub[1] + (ny - hub[1]) * .6, hub[0], hub[1]); x.stroke();
    for (let q = 0; q < 5; q++) { // packets both ways
      const ph = ((t * .9 + q / 5 + nx * .001) % 1), dir = q % 2, kk = dir ? ph : 1 - ph;
      const p = bez([nx, ny], [nx + (hub[0] - nx) * .6, ny], [hub[0], hub[1] + (ny - hub[1]) * .6], hub, kk);
      x.fillStyle = dir ? TEAL : BLUE; x.globalAlpha = eo(k * 3); x.beginPath(); x.arc(p[0], p[1], 7 * U, 0, Math.PI * 2); x.fill(); x.globalAlpha = 1;
    }
  }
  for (const [nm, nx, ny] of n) { const s = eback(pr(k, .05, .35)); x.save(); x.translate(nx, ny); x.scale(s, s); card(-110 * U, -46 * U, 220 * U, 92 * U, 20); txt(nm, 0, 10 * U, 26 * U, FG, 700, 'center'); x.restore(); }
  const hs = eback(pr(k, 0, .3)); x.save(); x.translate(hub[0], hub[1]); x.scale(hs, hs); x.fillStyle = INK; x.beginPath(); x.arc(0, 0, 70 * U, 0, Math.PI * 2); x.fill(); logoMark(0, 0, 30 * U, 1, 10 * U); x.restore();
  const pulse = (t * 1.2) % 1; x.strokeStyle = `rgba(63,208,184,${1 - pulse})`; x.lineWidth = 3 * U; x.beginPath(); x.arc(hub[0], hub[1], 70 * U + pulse * 60 * U, 0, Math.PI * 2); x.stroke();
}
function vizQuality(b, k, t) {
  const rows = 11, rh = b.h / rows, scan = eio(pr(k, .08, .85));
  card(b.x, b.y, b.w, b.h, 24);
  for (let i = 0; i < rows; i++) {
    const y = b.y + i * rh, passed = scan * rows > i + .5, bad = i === 3 || i === 8, fixed = scan * rows > i + 2.2;
    x.fillStyle = 'rgba(11,18,32,.09)'; x.fillRect(b.x + 40 * U, y + rh / 2 - 6 * U, b.w * .5, 12 * U);
    if (passed) { const c = bad && !fixed ? RED : GREEN, sk = eback(cl((scan * rows - i - .5) * 2));
      x.save(); x.translate(b.x + b.w - 60 * U, y + rh / 2); x.scale(sk, sk); x.fillStyle = c; x.beginPath(); x.arc(0, 0, 16 * U, 0, Math.PI * 2); x.fill();
      x.strokeStyle = '#fff'; x.lineWidth = 4 * U; x.beginPath(); if (bad && !fixed) { x.moveTo(-6 * U, -6 * U); x.lineTo(6 * U, 6 * U); x.moveTo(6 * U, -6 * U); x.lineTo(-6 * U, 6 * U); } else { x.moveTo(-7 * U, 0); x.lineTo(-2 * U, 6 * U); x.lineTo(8 * U, -6 * U); } x.stroke(); x.restore();
      if (bad && !fixed) { x.fillStyle = 'rgba(255,77,94,.1)'; x.fillRect(b.x + 8 * U, y + 4 * U, b.w - 16 * U, rh - 8 * U); }
      if (bad && fixed) txt('auto-fixed', b.x + b.w - 100 * U, y + rh / 2 + 7 * U, 18 * U, GREEN, 650, 'right');
    }
  }
  const sy = b.y + scan * b.h; const g = x.createLinearGradient(0, sy - 60 * U, 0, sy); g.addColorStop(0, 'rgba(63,208,184,0)'); g.addColorStop(1, 'rgba(63,208,184,.35)');
  x.fillStyle = g; x.fillRect(b.x, sy - 60 * U, b.w, 60 * U); x.fillStyle = TEAL; x.fillRect(b.x, sy - 2 * U, b.w, 4 * U);
}
function vizReport(b, k, t) {
  card(b.x, b.y, b.w, b.h, 24);
  const n = 8, bw = b.w * .7 / n, base = b.y + b.h * .82, vals = [.35, .5, .42, .62, .58, .74, .7, .9];
  txt('Weekly sales', b.x + 40 * U, b.y + 64 * U, 30 * U, FG, 750);
  for (let i = 0; i < n; i++) { const kk = spring(cl((k - .05 - i * .045) / .5), 2, 6), h = vals[i] * b.h * .55 * kk;
    const bx = b.x + b.w * .1 + i * (b.w * .8 / n); rr(bx, base - h, bw, h, 8 * U); x.fillStyle = i === n - 1 ? BLUE : 'rgba(111,134,255,.35)'; x.fill(); }
  const lk = eio(pr(k, .35, .75)); x.strokeStyle = TEAL; x.lineWidth = 5 * U; x.lineJoin = 'round'; x.beginPath();
  for (let i = 0; i < n; i++) { const px = b.x + b.w * .1 + i * (b.w * .8 / n) + bw / 2, py = base - vals[i] * b.h * .55 - 30 * U; if (i / (n - 1) > lk) break; i ? x.lineTo(px, py) : x.moveTo(px, py); } x.stroke();
  const sk = eback(pr(k, .72, .9)); if (sk > 0) { x.save(); x.translate(b.x + b.w - 40 * U, b.y + 50 * U); x.scale(sk, sk); rr(-200 * U, -30 * U, 200 * U, 56 * U, 28 * U); x.fillStyle = GREEN; x.fill(); txt('Sent 07:00 ✓', -100 * U, 8 * U, 22 * U, '#fff', 700, 'center'); x.restore(); }
}
function vizSchedule(b, k, t) {
  card(b.x, b.y, b.w, b.h, 24);
  const lanes = 6, lh = b.h * .8 / lanes, oy = b.y + b.h * .14, slip = eio(pr(k, .25, .45)), replan = eio(pr(k, .45, .8));
  const base = [[0, .3], [.25, .5], [.1, .35], [.45, .7], [.3, .55], [.6, .9]];
  for (let c = 0; c < 8; c++) { x.fillStyle = 'rgba(11,18,32,.05)'; x.fillRect(b.x + b.w * .06 + c * b.w * .11, oy, 1.5 * U, lh * lanes); }
  for (let i = 0; i < lanes; i++) {
    let [s, e] = base[i]; let c = 'rgba(111,134,255,.55)';
    if (i === 2) { e += .18 * slip; c = mix('#6f86ff', '#ffb547', slip * (1 - replan)); }
    if (i === 3 || i === 5) { s += .14 * replan; e += .14 * replan; if (replan > 0 && replan < 1) c = TEAL; }
    const ek = eo5(pr(k, i * .04, i * .04 + .3));
    rr(b.x + b.w * .06 + s * b.w * .86, oy + i * lh + lh * .22, (e - s) * b.w * .86 * ek, lh * .56, 10 * U); x.fillStyle = c; x.fill();
  }
  if (replan > .5) { x.globalAlpha = eo(pr(k, .75, .9)); txt('Re-planned · no clashes', b.x + b.w - 40 * U, b.y + 60 * U, 24 * U, GREEN, 700, 'right'); x.globalAlpha = 1; }
}
function vizAI(b, k, t) {
  const bins = [['Footwear', TEAL], ['Outerwear', BLUE], ['Accessories', AMBER]];
  const bw = (b.w - 60 * U) / 3;
  bins.forEach(([nm, c], i) => { const bx = b.x + i * (bw + 30 * U); rr(bx, b.y + b.h * .62, bw, b.h * .38, 20 * U); x.fillStyle = 'rgba(11,18,32,.04)'; x.fill(); x.strokeStyle = c; x.lineWidth = 2.5 * U; x.stroke(); txt(nm, bx + bw / 2, b.y + b.h - 26 * U, 22 * U, FG, 700, 'center'); });
  const R = rng(5);
  for (let q = 0; q < 9; q++) {
    const at = .04 + q * .085, kk = pr(k, at, at + .32); if (kk <= 0) continue;
    const bin = q % 3, bx = b.x + bin * (bw + 30 * U) + bw / 2 + (Math.floor(q / 3) - 1) * 70 * U;
    const p0 = [b.x + b.w / 2, b.y - 40 * U], p1 = [b.x + b.w / 2, b.y + b.h * .3], p2 = [bx, b.y + b.h * .74 + Math.floor(q / 3) * 8 * U];
    const p = kk < .5 ? [lerp(p0[0], p1[0], eo(kk * 2)), lerp(p0[1], p1[1], eo(kk * 2))] : bez(p1, [p1[0], p1[1] + 60 * U], [p2[0], p2[1] - 120 * U], p2, eio((kk - .5) * 2));
    x.save(); x.translate(p[0], p[1]); x.rotate((R() - .5) * .3); card(-60 * U, -40 * U, 120 * U, 80 * U, 12); x.fillStyle = bins[bin][1]; x.globalAlpha = .7; x.fillRect(-40 * U, -24 * U, 80 * U, 26 * U); x.globalAlpha = 1;
    if (kk > .45) txt((92 + Math.floor(R() * 7)) + '%', 0, 30 * U, 18 * U, FG, 700, 'center'); x.restore();
  }
  const sy = b.y + b.h * .3; x.strokeStyle = TEAL; x.lineWidth = 3 * U; x.setLineDash([10 * U, 8 * U]); x.beginPath(); x.moveTo(b.x + b.w * .25, sy); x.lineTo(b.x + b.w * .75, sy); x.stroke(); x.setLineDash([]);
  txt('AI sorts · confidence shown', b.x + b.w / 2, sy - 70 * U, 20 * U, MUTED, 600, 'center');
}
function vizTools(b, k, t) {
  const cols = ['Requested', 'Approved'], cw = (b.w - 40 * U) / 2;
  cols.forEach((nm, i) => { const cx = b.x + i * (cw + 40 * U); rr(cx, b.y, cw, b.h, 22 * U); x.fillStyle = 'rgba(11,18,32,.04)'; x.fill(); txt(nm, cx + 30 * U, b.y + 52 * U, 26 * U, FG, 750); });
  for (let q = 0; q < 5; q++) {
    const at = .1 + q * .12, kk = eio(pr(k, at, at + .3));
    const fx = b.x + 20 * U, fy = b.y + 90 * U + q * 96 * U, tx = b.x + cw + 60 * U, ty = b.y + 90 * U + q * 96 * U;
    const px = lerp(fx, tx, kk), py = lerp(fy, ty, kk) - Math.sin(kk * Math.PI) * 60 * U;
    x.save(); x.translate(px, py); x.rotate(Math.sin(kk * Math.PI) * .08); card(0, 0, cw - 40 * U, 80 * U, 14);
    txt(['Expense · £84', 'Holiday · 3 days', 'Purchase · £1,200', 'Access · CRM', 'Refund · £45'][q], 24 * U, 48 * U, 22 * U, FG, 650);
    if (kk >= 1) { const sk = eback(pr(k, at + .3, at + .4)); x.save(); x.translate(cw - 80 * U, 40 * U); x.scale(sk, sk); x.fillStyle = GREEN; x.beginPath(); x.arc(0, 0, 18 * U, 0, Math.PI * 2); x.fill(); x.strokeStyle = '#fff'; x.lineWidth = 4 * U; x.beginPath(); x.moveTo(-7 * U, 0); x.lineTo(-2 * U, 6 * U); x.lineTo(8 * U, -6 * U); x.stroke(); x.restore(); }
    x.restore();
  }
}
const VIZ = [vizIntegrations, vizQuality, vizReport, vizSchedule, vizAI, vizTools];
// ---------- proof ----------
function odometer(n, px, py, size, k, color, suffix) {
  const s = String(n), dg = s.length; x.font = font(size, 850); x.letterSpacing = (-.04 * size) + 'px'; x.textAlign = 'center';
  const ws = [...s].map(d => x.measureText(d).width), xs = ws.map((_, i) => px + ws.slice(0, i).reduce((a, b) => a + b, 0) + ws[i] / 2), total = ws.reduce((a, b) => a + b, 0);
  x.save(); x.beginPath(); x.rect(px - 20 * U, py - size * .9, total + 40 * U, size * 1.05); x.clip(); x.fillStyle = color;
  for (let i = 0; i < dg; i++) {
    const target = +s[i], spins = (dg - i) * 2 + 1, pos = (target + 10 * spins) * eo5(cl(k * (1 + i * .15)));
    for (let d = -1; d <= 1; d++) { const v = ((Math.floor(pos) + d) % 10 + 10) % 10, off = (pos - Math.floor(pos)) - d; x.fillText(String(v), xs[i], py + off * size); }
  }
  x.restore(); x.textAlign = 'left';
  if (suffix) { x.globalAlpha = eo(pr(k, .6, .9)); x.fillStyle = TEAL; x.fillText(suffix, px + total + .02 * size, py); x.globalAlpha = 1; }
  x.letterSpacing = '0px';
}

// ================= ONE WORLD, ONE CAMERA =================
// Everything lives in one world. The camera never cuts: it drifts, tracks, dives and whips between places,
// following one invoice record from the client's problem to our system and back to their customer.
const CW = 168, CH = 52, COLS = 26, ROWS = 30, SX = -COLS * CW / 2, SY = -ROWS * CH / 2;
const R1 = rng(7), CELLS = [];
for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
  const v = R1(); CELLS.push({ r, c, s: c === 0 ? 'SKU-' + (4100 + r * 7) : c === 1 ? ['Order', 'Refund', 'Invoice', 'Return'][r % 4] : v < .5 ? (v * 9000).toFixed(2) : v < .8 ? Math.round(v * 400).toString() : '£' + (v * 2000).toFixed(2) });
}
const cellW = (c, r) => [SX + (c + .5) * CW, SY + (r + .5) * CH];
const CARDS = [[300, -90], [820, -90], [1340, -90]], CARDW = 380, CARDH = 520;   // the three identical reports
const REC0 = [1340 + CARDW / 2 - 70, -90 - CARDH / 2 + 120 + 2 * 40 - 8];          // the bad cell on the third report
const INBOX = [2900, 220], IW = 640, IH = 360, LAND = [INBOX[0] + 150, INBOX[1] - IH / 2 + 236];
const C = [5600, 0], RR = 1400, ROAD = RR * .378;                                   // the ring: our logo, and the road
const DOT = [C[0] + RR * .933, C[1] - RR * .344], DOTR = RR * .311;
const deg = d => d * Math.PI / 180, onRing = (a, r = RR) => [C[0] + Math.cos(deg(a)) * r, C[1] + Math.sin(deg(a)) * r];
const S0 = 22.03, SD = 2.1428;
const ST = [0, 1, 2, 3, 4, 5].map(i => 25 + 270.8 * (i + .5) / 6);                    // station angles along the ring
